# Kokpit — Docker Compose
#
# Usage:
#   Dev (hot reload):  docker compose up kokpit-dev
#   Prod:              docker compose up kokpit --build

services:

  # ─── Development (hot reload) ─────────────────────────────
  kokpit-dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      KOKPIT_SESSION_SECRET: change-this-to-a-random-32-char-secret-before-use
      KOKPIT_DB_PATH: /data/users.db
      # WATCHPACK_POLLING: "true"  # Uncomment on Windows/WSL2 if hot reload
                                   # doesn't trigger on file save.
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data:/data
      # Uncomment to enable the Docker widget (read-only socket; see README):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ─── Production ───────────────────────────────────────────
  kokpit:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      KOKPIT_SESSION_SECRET: change-this-to-a-random-32-char-secret-before-use
    volumes:
      - ./data:/data
      # Uncomment to enable the Docker widget (read-only socket; see README):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not "localhost": the server binds 0.0.0.0 (IPv4-only) while
      # "localhost" also resolves to ::1 inside the container, and BusyBox wget
      # never falls back past the first address it resolves. $$PORT is escaped
      # so the container's shell expands it, not Compose.
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${PORT:-3000}/api/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
