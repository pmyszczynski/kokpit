# ═══════════════════════════════════════════════════════════════
# Kokpit — settings.example.yaml
#
# Copy this file to settings.yaml and fill in your values.
# settings.yaml is gitignored — your credentials stay local.
#
# The in-app UI reads from and writes back to settings.yaml.
# Changes take effect without restarting the server.
#
# Schema version: 2
# ═══════════════════════════════════════════════════════════════

schema_version: 2

# ─── Auth ────────────────────────────────────────────────────
# When auth.enabled is true, the dashboard and protected APIs require a valid
# session. Login, setup, recovery, and /api/health remain public.
# ─────────────────────────────────────────────────────────────
auth:
  enabled: true # Set false to disable auth (or use KOKPIT_AUTH_DISABLED=true env var)
  session_ttl_hours: 24
  # users: []             # Populated by first-run setup wizard

# ─── Appearance ───────────────────────────────────────────────
appearance:
  theme: dark
  # card_blur: 8            # optional; frosted-glass blur (px) on tiles.
  #                         # Cards stay opaque unless this is set (> 0).
  # background:             # optional dashboard background. All keys optional.
  #   color: "#0b0d12"      # solid color, OR
  #   gradient: "linear-gradient(135deg, #0b0d12, #1a2233)"  # OR
  #   image: /api/backgrounds/user/<hash>.jpg  # uploaded path or any image URL
  #                         # (last-wins if more than one of the three is set:
  #                         #  image > gradient > color)
  #   blur: 12              # blur-behind radius (px)
  #   brightness: 0.7       # 0–1, dims the image
  #   opacity: 0.4          # 0–1, theme-tinted overlay on top of the background
layout:
  columns: 4
  row_height: 120 # pixels
  # ungrouped: last       # Where the implicit "ungrouped" section renders:
  #                       # first | last (default: last)

# ─── Groups (optional) ────────────────────────────────────────
# Ordered group declarations — array order is display order.
# Groups referenced by services but not listed here are appended
# automatically (alphabetically), so this block is optional.
# ─────────────────────────────────────────────────────────────
# groups:
#   - name: Media
#     collapsed: false    # default expanded; live state is per-browser
#     columns: 4          # optional per-group column override
#   - name: Downloads
#   - name: Infrastructure

# ─── Services (app tiles + optional inline widgets) ───────────
# Services hold reusable application metadata and integration connections.
# Service tiles independently reference them for dashboard presentation.
# ─────────────────────────────────────────────────────────────
services: []
service_tiles: []

# Tile sizing: every service_tile accepts an optional size preset —
#   size: normal | wide | tall | large   (normal = 1×1, wide = 2×1,
#   tall = 1×2, large = 2×2). When omitted, the widget's preferred
#   size applies (e.g. queue/list widgets suggest "tall"), falling
#   back to "normal". The legacy position: field is DEPRECATED —
#   use size: plus array order instead.
#
# Schema-v2 example entries (uncomment and fill in your values). Services own
# reusable connections; tiles own placement and widget-specific options:
# services:
#   - id: 10000000-0000-4000-8000-000000000001
#     name: Plex
#     launch_url: http://192.168.1.x:32400
#     integration:
#       type: plex
#       config:
#         url: http://192.168.1.x:32400
#         token: <your-plex-token>
# service_tiles:
#   - id: 20000000-0000-4000-8000-000000000001
#     service_id: 10000000-0000-4000-8000-000000000001
#     group: Media
#     size: large
#     widget:
#       type: plex
#       config:
#         fields:
#           - streams
#           - transcodes
#
# Additional schema-v2 widget examples (connection fields belong to the
# service integration; display and filtering options belong to the tile):
# services:
#   - id: 10000000-0000-4000-8000-000000000002
#     name: Tautulli
#     launch_url: http://192.168.1.x:8181
#     integration:
#       type: tautulli
#       config:
#         url: http://192.168.1.x:8181
#         api_key: <your-tautulli-api-key>
# service_tiles:
#   - id: 20000000-0000-4000-8000-000000000002
#     service_id: 10000000-0000-4000-8000-000000000002
#     group: Media
#     size: tall
#     widget:
#       type: tautulli-activity
#       config:
#         sections: [summary, sessions]
#
# Repeat this service/service_tile pattern for the other integrations listed
# in README.md; never place url, group, or widget directly under services.
#
# Legacy service-shaped widget examples have been replaced by the schema-v2
# pattern above. Keep connections on services[].integration.config and put only
# tile-specific options on service_tiles[].widget.config. For example:
# services:
#   - id: 10000000-0000-4000-8000-000000000003
#     name: qBittorrent
#     launch_url: http://192.168.1.x:8080
#     integration:
#       type: qbittorrent
#       config:
#         url: http://192.168.1.x:8080
#         username: <your-username>
#         password: <your-password>
#   - id: 10000000-0000-4000-8000-000000000004
#     name: Actual Budget
#     launch_url: http://192.168.1.x:5006 # browser navigation, not the sidecar
#     integration:
#       type: actualbudget
#       config:
#         url: http://actual-http-api:5007
#         api_key: <your-sidecar-api-key>
#         budget_sync_id: <your-sync-id>
# service_tiles:
#   - id: 20000000-0000-4000-8000-000000000003
#     service_id: 10000000-0000-4000-8000-000000000003
#     widget:
#       type: qbittorrent-torrents
#       config: { limit: 10, filter: downloading }
#   - id: 20000000-0000-4000-8000-000000000004
#     service_id: 10000000-0000-4000-8000-000000000004
#     widget:
#       type: actualbudget-categories
#       config: { limit: 8, hide_income: true, hide_empty: true, timezone: Europe/Warsaw }
#
# The other network integrations use their service name as integration.type:
# plex, tautulli, sabnzbd, tdarr, sonarr, radarr, prowlarr, seerr, immich,
# unraid, and netdata. Reuse one service integration for its related widgets.
# Docker is a local informational widget, but still requires a matching
# `docker` service integration. System-stats remains integration-free; its
# complete configuration is on the tile.
#
# See README.md § Widgets for the full field reference for every widget type.

# ─── Bookmarks (optional) ─────────────────────────────────────
# A bookmark group is a single grid tile holding plain links —
# far cheaper than one service tile per link. Placement is
# optional; by default bookmark tiles render at the end.
# ─────────────────────────────────────────────────────────────
# bookmarks:
#   - name: Dev
#     accent: "#7aa2f7"           # group accent (header + link markers)
#     style: list                 # list | icon-grid | compact (default: list)
#     placement:
#       group: Infrastructure     # optional: render inside this group
#       size: tall                # optional: tile size preset
#     links:
#       - name: GitHub
#         url: https://github.com
#         icon: sh-github         # optional; falls back to favicon, then abbr
#       - name: Grafana docs
#         url: https://grafana.com/docs
#         abbr: GD                # 2-letter fallback when there is no icon
#         description: Panels & alerting reference # shown in list style only
