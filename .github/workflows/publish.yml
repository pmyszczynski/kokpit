name: Publish Docker Image

on:
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish.
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g., v0.2.6). Needed because releases created by GITHUB_TOKEN (our Create Release workflow) do not auto-trigger this workflow — GitHub suppresses events authored by GITHUB_TOKEN to prevent recursive runs.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Align JS action runtime with runner default (see GitHub Actions Node 20 deprecation)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          else
            IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)
          fi
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest,enable=${{ steps.release_info.outputs.prerelease != 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IS_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          tags=("$TAG" "$VERSION")
          if [ "$IS_PRERELEASE" != "true" ]; then
            tags+=("${VERSION%.*}" latest)
          fi

          for tag in "${tags[@]}"; do
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null; then
                echo "Verified $IMAGE:$tag"
                break
              fi

              if [ "$attempt" = "6" ]; then
                echo "::error::Timed out waiting for $IMAGE:$tag"
                exit 1
              fi

              echo "Waiting for $IMAGE:$tag (attempt $attempt of 6)"
              sleep 10
            done
          done
