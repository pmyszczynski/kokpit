name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The first three are the defaults for `pull_request`; `ready_for_review` is
    # not, and is listed deliberately — do not drop it. A PR opened through the
    # API/MCP starts no run at all (GitHub suppresses workflow events authored by
    # GITHUB_TOKEN to prevent recursive runs), so without this entry an
    # automation-opened draft sits with no CI until someone happens to push a
    # commit. With it, flipping the PR out of draft starts the suite.
    # See "CI on Pull Requests" in AGENTS.md.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          # Coverage trend is only worth checking on demand; a short
          # retention avoids piling up artifacts nothing consumes automatically.
          retention-days: 7

  e2e:
    name: E2E
    # Keep this in sync with update-playwright-snapshots.yml and release.yml.
    # Visual baselines depend on the runner's fonts and rendering libraries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7

      - name: Generate visual snapshots in the failing CI environment
        if: failure() && steps.e2e.outcome == 'failure'
        id: snapshot_generation
        run: npm run test:e2e:update-snapshots

      - name: Upload CI-generated visual snapshots
        if: failure() && steps.e2e.outcome == 'failure' && steps.snapshot_generation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-snapshots
          path: e2e/tests/**/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Run auth E2E tests
        run: npm run test:e2e:auth

      - name: Upload auth Playwright failure artifacts
        if: failure() && steps.e2e.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
